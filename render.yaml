# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → pick this repository. Render asks for the values marked `sync: false`.
#
# This file starts on Render's FREE plan, as a demo:
#   - the service sleeps after ~15 minutes without visits and takes about a minute to wake up;
#   - there is no persistent disk, so every restart, wake-up or deploy starts from a fresh database.
#     Content is reseeded and the administrator is recreated from ADMIN_EMAIL / ADMIN_PASSWORD,
#     but new accounts, progress and admin edits are lost.
#
# To keep data permanently (paid Starter instance with a disk), see docs/DEPLOYMENT.md, "Option B":
#   plan: starter
#   buildCommand: npm ci --include=dev && DATABASE_PATH=./data/build.db npm run build
#   DATABASE_PATH: /var/data/academy.db
#   disk: { name: academy-data, mountPath: /var/data, sizeGB: 1 }
services:
  - type: web
    name: qa-engineering-academy
    runtime: node
    plan: free
    region: frankfurt
    # Dev dependencies are needed: the start-up script runs with tsx.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # The database file (./data/academy.db) is created during the build and used by the server.
      # NEXT_PUBLIC_SITE_URL is optional: Render's own RENDER_EXTERNAL_URL is used for links and the
      # sitemap. Add it only when you attach a custom domain.
      - key: ADMIN_EMAIL
        sync: false # first administrator, created only if no administrator exists
      - key: ADMIN_PASSWORD
        sync: false # 10+ characters with a letter and a number; never shown in the app
      - key: ADMIN_NAME
        value: Eman Abo-Oun
